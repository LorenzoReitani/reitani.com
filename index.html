<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lorenzo Reitani</title>
  <meta name="description" content="Personal website of Lorenzo Reitani." />
  <link rel="canonical" href="https://reitani.com/" />
  <style>
    :root { --text:#111827; --muted:#6b7280; --bg:#f9fafb; --card:#ffffff; --line:#e5e7eb; --accent:#111827; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
    main { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 20px; }
    .card { max-width:720px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:42px; box-shadow:0 10px 30px rgba(17,24,39,.05); }
    h1 { font-size:clamp(2rem, 5vw, 3.25rem); margin:0 0 10px; letter-spacing:-.04em; }
    p { font-size:1.05rem; line-height:1.65; color:var(--muted); margin:0 0 22px; }
    a.button { display:inline-block; padding:12px 18px; border-radius:10px; background:var(--accent); color:white; text-decoration:none; font-weight:600; }
    a.button:hover { opacity:.9; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Lorenzo Reitani</h1>
      <p>This page is currently reserved for future personal and professional information.</p>
      <a class="button" href="/masterThesis/">View Master’s Thesis</a>
    </section>
  </main>
</body>
</html>
